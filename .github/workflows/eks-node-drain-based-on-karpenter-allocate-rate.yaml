name: Drain EKS Node based on karpenter allocate rate

on:
  workflow_dispatch:
    inputs:
      COMMAND:
        description: '실행할 명령어입니다.'
        type: choice
        options:
          - 'drain'
          - 'karpenter allocate-rate'
        required: true
        default: 'drain'
      CLUSTER_NAME:
        description: '클러스터 이름입니다.'
        type: choice
        options:
          - 'devel_eks_cluster'
          - 'alpha_eks_cluster'
          - 'product_eks_cluster'
        required: true
        default: 'devel_eks_cluster'
      PROMETHEUS_ADDRESS:
        description: 'Prometheus/Mimir 주소입니다.'
        type: string
        required: true
      PROMETHEUS_TENANT_ID:
        description: 'Prometheus/Mimir tenant ID(X-Scope-OrgID)입니다. 비테넌트 Prometheus면 빈 값으로 둡니다.'
        type: string
        required: false
        default: 'organization-dev'
      PROMETHEUS_ORG_ID:
        description: 'Deprecated: PROMETHEUS_TENANT_ID를 사용하세요.'
        type: string
        required: false
        default: ''
      NODEPOOL_NAME:
        description: '드레인 하려는 Nodepool 이름입니다.'
        type: string
        required: true
      KUBE_CONFIG:
        description: '프로그램이 실행되는 위치입니다.'
        type: choice
        options:
          - 'local'
          - 'github_action'
          - 'cluster'
        required: true
        default: 'github_action'
      DRAIN_MIN:
        description: '드레인 최소 노드 수(0=비활성)'
        required: false
        default: '1'
      DRAIN_MAX_ABSOLUTE:
        description: '드레인 최대 노드 수(절대값, 0=비활성)'
        required: false
        default: '2'
      DRAIN_MAX_FRACTION:
        description: '드레인 최대 비율(예: 0.2=20%, 0=비활성)'
        required: false
        default: '0.2'
      DRAIN_SAFETY_MAX_ALLOCATE_RATE:
        description: '안전 조건: maxAllocateRate >= 값이면 0대로 강제(0=비활성)'
        required: false
        default: '90'
      DRAIN_PROGRESSIVE:
        description: '점진적 드레인 여부'
        type: choice
        options:
          - 'true'
          - 'false'
        required: false
        default: 'true'
      DRAIN_LOCK_MODE:
        description: '중복 실행 lock 방식'
        type: choice
        options:
          - 'kubernetes'
          - 'local'
          - 'none'
        required: false
        default: 'kubernetes'
      DRAIN_LOCK_NAMESPACE:
        description: 'Kubernetes Lease lock namespace'
        required: false
        default: 'kube-system'
      DRAIN_LOCK_LEASE_DURATION:
        description: 'Kubernetes Lease lock 만료 시간'
        required: false
        default: '10m'
      POD_EVICTION_MODE:
        description: '파드 제거 방식'
        type: choice
        options:
          - 'evict'
          - 'delete'
        required: false
        default: 'evict'
      FORCE:
        description: 'eviction 반복 실패 시 delete로 강제 전환'
        type: choice
        options:
          - 'false'
          - 'true'
        required: false
        default: 'false'
      FORCE_PROBLEM_PODS:
        description: '문제 파드 즉시 delete(grace=0)'
        type: choice
        options:
          - 'true'
          - 'false'
        required: false
        default: 'true'
      PDB_TOKEN:
        description: '같은 PDB 동시 처리 제한'
        type: choice
        options:
          - 'true'
          - 'false'
        required: false
        default: 'true'
      PDB_TOKEN_MAX_IN_FLIGHT:
        description: '같은 PDB 토큰 동시 처리 개수'
        required: false
        default: '1'
      POD_EVICTION_TIMEOUT:
        description: '노드 단위 Pod 제거 전체 타임아웃'
        required: false
        default: '10m'
      POD_NODE_TERMINATION_TIMEOUT:
        description: '노드의 데몬셋 제외 Pod 종료 대기 타임아웃'
        required: false
        default: '10m'
      POD_NODE_TERMINATION_CHECK_TICK:
        description: '노드 Pod 종료 상태 확인 주기'
        required: false
        default: '15s'
      POD_POST_EVICTION_NODE_DELAY:
        description: '노드 드레인 후 추가 대기 시간(0s=비활성)'
        required: false
        default: '50s'
      EKS_CLUSTER_VERSION:
        description: '클러스터 버전입니다. - ex) v1.28.0 / v1.29.0'
        required: true
        default: 'v1.28.0'
      AWS_ID:
        description: 'AWS 계정 ID 입니다.'
        required: true

jobs:
  run:
    name: Drain EKS Node based on karpenter allocate rate
    runs-on: sre
    environment: main
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Install AWS CLI v2
      run: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip awscliv2.zip
        sudo ./aws/install --update

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ inputs.AWS_ID }}:role/github_action_role
        aws-region: "ap-northeast-2"
        role-duration-seconds: 21600

    - name: Verify AWS credentials
      run: |
        aws sts get-caller-identity
        aws iam get-role --role-name github_action_role
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: ${{ inputs.EKS_CLUSTER_VERSION }}

    - name: Create .kube directory
      run: mkdir -p ~/.kube

    - name: Change kube config
      run: |
        aws eks update-kubeconfig --name "${{ inputs.CLUSTER_NAME }}" --region ap-northeast-2
        kubectl config use-context "arn:aws:eks:ap-northeast-2:${{ inputs.AWS_ID }}:cluster/${{ inputs.CLUSTER_NAME }}"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Run go vet
      run: go vet ./...

    - name: Run tests
      run: go test ./...

    - name: Run race tests
      run: go test -race ./pkg/node ./pkg/pod

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.61
        args: --timeout=5m

    - name: Run
      id: Run
      shell: bash
      env:
        SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
      run: |
        set -euo pipefail

        cmd=(go run main.go)
        if [[ "${{ inputs.COMMAND }}" == "drain" ]]; then
          cmd+=(drain)
          cmd+=(--drain-min "${{ inputs.DRAIN_MIN }}")
          cmd+=(--drain-max-absolute "${{ inputs.DRAIN_MAX_ABSOLUTE }}")
          cmd+=(--drain-max-fraction "${{ inputs.DRAIN_MAX_FRACTION }}")
          cmd+=(--drain-safety-max-allocate-rate "${{ inputs.DRAIN_SAFETY_MAX_ALLOCATE_RATE }}")
          cmd+=(--drain-progressive="${{ inputs.DRAIN_PROGRESSIVE }}")
          cmd+=(--drain-lock-mode "${{ inputs.DRAIN_LOCK_MODE }}")
          cmd+=(--drain-lock-namespace "${{ inputs.DRAIN_LOCK_NAMESPACE }}")
          cmd+=(--drain-lock-lease-duration "${{ inputs.DRAIN_LOCK_LEASE_DURATION }}")
          cmd+=(--pod-eviction-mode "${{ inputs.POD_EVICTION_MODE }}")
          cmd+=(--force="${{ inputs.FORCE }}")
          cmd+=(--force-problem-pods="${{ inputs.FORCE_PROBLEM_PODS }}")
          cmd+=(--pdb-token="${{ inputs.PDB_TOKEN }}")
          cmd+=(--pdb-token-max-in-flight "${{ inputs.PDB_TOKEN_MAX_IN_FLIGHT }}")
          cmd+=(--pod-eviction-timeout "${{ inputs.POD_EVICTION_TIMEOUT }}")
          cmd+=(--pod-node-termination-timeout "${{ inputs.POD_NODE_TERMINATION_TIMEOUT }}")
          cmd+=(--pod-node-termination-check-tick "${{ inputs.POD_NODE_TERMINATION_CHECK_TICK }}")
          cmd+=(--pod-post-eviction-node-delay "${{ inputs.POD_POST_EVICTION_NODE_DELAY }}")
        else
          cmd+=(karpenter allocate-rate)
        fi
        prometheus_tenant_id="${{ inputs.PROMETHEUS_TENANT_ID }}"
        if [[ -z "${prometheus_tenant_id}" ]]; then
          prometheus_tenant_id="${{ inputs.PROMETHEUS_ORG_ID }}"
        fi

        cmd+=(--prometheus-address "${{ inputs.PROMETHEUS_ADDRESS }}")
        cmd+=(--prometheus-tenant-id "${prometheus_tenant_id}")
        cmd+=(--nodepool-name "${{ inputs.NODEPOOL_NAME }}")
        cmd+=(--slack-webhook-url "${SLACK_WEBHOOK_URL:-}")
        cmd+=(--kube-config "${{ inputs.KUBE_CONFIG }}")
        cmd+=(--cluster-name "${{ inputs.CLUSTER_NAME }}")

        "${cmd[@]}"
