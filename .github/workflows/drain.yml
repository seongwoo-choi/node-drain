name: drain

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: "클러스터 이름(알림/로그 표시용)"
        required: true
        type: string
      nodepool_name:
        description: "드레인 대상 Karpenter NodePool 이름"
        required: true
        type: string
      kube_config_mode:
        description: "KUBE_CONFIG 모드(local|cluster|github_action)"
        required: true
        default: "github_action"
        type: string
      prometheus_address:
        description: "Prometheus/Mimir 주소 (예: http://prometheus.monitoring.svc:9090/prometheus)"
        required: true
        type: string
      prometheus_org_id:
        description: "Prometheus OrgID(X-Scope-OrgID)"
        required: true
        default: "organization-dev"
        type: string

      # 드레인 정책(기본값은 기존 동작과 동일하게 두고, 워크플로우에서 안전한 권장값을 넣기 쉽도록 inputs 제공)
      drain_min:
        description: "드레인 최소 노드 수(0=비활성)"
        required: false
        default: "1"
        type: string
      drain_max_absolute:
        description: "드레인 최대 노드 수(절대값, 0=비활성)"
        required: false
        default: "2"
        type: string
      drain_max_fraction:
        description: "드레인 최대 비율(예: 0.2=20%, 0=비활성)"
        required: false
        default: "0.2"
        type: string
      drain_safety_max_allocate_rate:
        description: "안전 조건: maxAllocateRate >= 값이면 0대로 강제(0=비활성)"
        required: false
        default: "90"
        type: string
      drain_progressive:
        description: "점진적 드레인(노드 1대 처리 후 안전 조건 재평가)"
        required: false
        default: "true"
        type: string
      drain_lock_mode:
        description: "중복 실행 lock 방식(local|kubernetes|none). Actions 기본은 distributed lock"
        required: false
        default: "kubernetes"
        type: string
      drain_lock_namespace:
        description: "Kubernetes Lease lock namespace"
        required: false
        default: "kube-system"
        type: string
      drain_lock_lease_duration:
        description: "Kubernetes Lease lock 만료 시간"
        required: false
        default: "10m"
        type: string

      # 파드 제거 정책
      pod_eviction_mode:
        description: "파드 제거 방식(evict|delete)"
        required: false
        default: "evict"
        type: string
      force:
        description: "eviction 반복 실패 시 delete로 강제 전환"
        required: false
        default: "false"
        type: string
      force_problem_pods:
        description: "문제 파드 즉시 delete(grace=0)"
        required: false
        default: "true"
        type: string
      pdb_token:
        description: "같은 PDB 동시 처리 제한(토큰)"
        required: false
        default: "true"
        type: string
      pdb_token_max_in_flight:
        description: "같은 PDB 토큰 동시 처리 개수"
        required: false
        default: "1"
        type: string
      pod_eviction_timeout:
        description: "노드 단위 Pod 제거 전체 타임아웃"
        required: false
        default: "10m"
        type: string
      pod_node_termination_timeout:
        description: "노드의 데몬셋 제외 Pod 종료 대기 타임아웃"
        required: false
        default: "10m"
        type: string
      pod_node_termination_check_tick:
        description: "노드 Pod 종료 상태 확인 주기"
        required: false
        default: "15s"
        type: string
      pod_post_eviction_node_delay:
        description: "노드 드레인 후 추가 대기 시간(0s=비활성)"
        required: false
        default: "50s"
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure kubeconfig from secret
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KUBECONFIG_B64:-}" ]]; then
            echo "KUBECONFIG_B64 is not set; relying on runner kubeconfig"
            exit 0
          fi
          mkdir -p "${HOME}/.kube"
          printf '%s' "${KUBECONFIG_B64}" | base64 -d > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Run drain
        shell: bash
        env:
          # Slack은 선택 사항(비어 있으면 알림 전송만 실패하고 drain 자체는 진행됨)
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          go run main.go drain \
            --cluster-name "${{ inputs.cluster_name }}" \
            --nodepool-name "${{ inputs.nodepool_name }}" \
            --kube-config "${{ inputs.kube_config_mode }}" \
            --prometheus-address "${{ inputs.prometheus_address }}" \
            --prometheus-org-id "${{ inputs.prometheus_org_id }}" \
            --slack-webhook-url "${SLACK_WEBHOOK_URL:-}" \
            --drain-min "${{ inputs.drain_min }}" \
            --drain-max-absolute "${{ inputs.drain_max_absolute }}" \
            --drain-max-fraction "${{ inputs.drain_max_fraction }}" \
            --drain-safety-max-allocate-rate "${{ inputs.drain_safety_max_allocate_rate }}" \
            --drain-progressive="${{ inputs.drain_progressive }}" \
            --drain-lock-mode "${{ inputs.drain_lock_mode }}" \
            --drain-lock-namespace "${{ inputs.drain_lock_namespace }}" \
            --drain-lock-lease-duration "${{ inputs.drain_lock_lease_duration }}" \
            --pod-eviction-mode "${{ inputs.pod_eviction_mode }}" \
            --force="${{ inputs.force }}" \
            --force-problem-pods="${{ inputs.force_problem_pods }}" \
            --pdb-token="${{ inputs.pdb_token }}" \
            --pdb-token-max-in-flight "${{ inputs.pdb_token_max_in_flight }}" \
            --pod-eviction-timeout "${{ inputs.pod_eviction_timeout }}" \
            --pod-node-termination-timeout "${{ inputs.pod_node_termination_timeout }}" \
            --pod-node-termination-check-tick "${{ inputs.pod_node_termination_check_tick }}" \
            --pod-post-eviction-node-delay "${{ inputs.pod_post_eviction_node_delay }}"
